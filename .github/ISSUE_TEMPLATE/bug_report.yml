name: Bug report
description: The checker gives a wrong verdict, report, or exit code, or the docs don't match what it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Don't use this form for security vulnerabilities; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what the checker printed or how it exited.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest premises.json and source files that show the problem, and the exact command.
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD` in your clone.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
